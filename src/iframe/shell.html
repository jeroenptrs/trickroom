<!doctype html>
<html lang="en" style="width:100%;height:100%;overflow:hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="trickroom-viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/tailwind/index.global.js"></script>
    <style>
      /*
       * Canvas boards sit side by side in one flex row. They never shrink to
       * share the pane, and boards the renderer (Artboards) marks as setting
       * no width of their own render at least the default width.
       * Render-time only; nothing is written to the design.
       */
      :root {
        --trickroom-canvas-board-default-width: 1280px;
      }
      @layer base {
        html[data-trickroom-stage-mode="canvas"]
          .frame-content
          > main
          > [data-trickroom-library] {
          width: fit-content;
          height: fit-content;
          flex-shrink: 0;
        }
        [data-trickroom-board-default-width] {
          min-width: var(--trickroom-canvas-board-default-width);
        }
      }
      /*
       * Percentage widths such as w-full resolve against main, so main gets the
       * same floor. Unlayered so it wins over main's min-w-screen utility.
       */
      html[data-trickroom-stage-mode="canvas"] .frame-content > main {
        min-width: max(100vw, var(--trickroom-canvas-board-default-width));
      }
      /*
       * Responsive mode previews one board in a viewport that scrolls like a
       * page: main grows with the board (instead of ending at 100vh), boards
       * narrower than the viewport stay centered, and anything larger scrolls
       * from the top-left. min-width: 100% keeps w-full boards clear of a
       * classic scrollbar, as on a real page.
       */
      html[data-trickroom-stage-mode="responsive"] #trickroom-viewport {
        overflow: auto;
      }
      html[data-trickroom-stage-mode="responsive"] .frame-content > main {
        bottom: auto;
        min-width: 100%;
        justify-content: safe center;
      }
      /*
       * Reveal-on-ready: in compiled mode the shell is marked
       * data-trickroom-await-styles, so design content stays hidden until
       * useCompiledTailwind injects the first compiled stylesheet and sets
       * data-trickroom-styles-ready. Prevents a flash of unstyled content.
       * Uses visibility (not display) so the stage can still measure board
       * size while hidden, keeping the fit/center logic working.
       */
      html[data-trickroom-await-styles]:not([data-trickroom-styles-ready]) .frame-content {
        visibility: hidden;
      }
    </style>
  </head>
  <body class="w-full h-full overflow-hidden">
    <div id="trickroom-viewport" tabindex="0" class="relative w-full h-full overflow-hidden bg-[#ffffff] focus-visible:outline-0"></div>
  </body>
</html>
