<!doctype html>
<html lang="en" style="width:100%;height:100%;overflow:hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="trickroom-viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/tailwind/index.global.js"></script>
    <style>
      @layer base {
        html[data-trickroom-stage-mode="canvas"]
          .frame-content
          > main
          > [data-trickroom-library] {
          width: fit-content;
          height: fit-content;
        }
      }
      /*
       * Reveal-on-ready: in compiled mode the shell is marked
       * data-trickroom-await-styles, so design content stays hidden until
       * useCompiledTailwind injects the first compiled stylesheet and sets
       * data-trickroom-styles-ready. Prevents a flash of unstyled content.
       * Uses visibility (not display) so the stage can still measure board
       * size while hidden, keeping the fit/center logic working.
       */
      html[data-trickroom-await-styles]:not([data-trickroom-styles-ready]) .frame-content {
        visibility: hidden;
      }
    </style>
  </head>
  <body class="w-full h-full overflow-hidden">
    <div id="trickroom-viewport" tabindex="0" class="relative w-full h-full overflow-hidden bg-[#ffffff] focus-visible:outline-0"></div>
  </body>
</html>
